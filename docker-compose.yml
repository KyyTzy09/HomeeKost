services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: homeekost_app
    restart: always
    mem_limit: 512m
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-secret}@db:5432/${POSTGRES_DB:-homeekost}?schema=public
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-homeekost-better-auth-secret-key-change-me-32chars}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3000}
      - APP_URL=${APP_URL:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: homeekost_db
    restart: always
    mem_limit: 256m
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-homeekost}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-secret}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-homeekost}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
